<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JK 단어시험 범위</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f4f6f8; --card:#fff; --ink:#1b2430; --sub:#6b7684; --line:#e5e8eb;
    --navy:#1f3a5f; --mint:#2bb3a3; --mint-soft:#e3f6f3; --orange:#ff8a3d; --orange-soft:#fff1e6;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Noto Sans KR',system-ui,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
  .wrap{max-width:520px;margin:0 auto;padding:16px 16px 40px}
  header{display:flex;justify-content:space-between;align-items:flex-end;margin:6px 2px 14px}
  .logo{display:block;height:22px;width:auto;max-width:200px;object-fit:contain;margin-bottom:8px}
  .logo[hidden]{display:none}
  header h1{font-size:20px;font-weight:800;color:var(--navy);letter-spacing:-.3px}
  header .today{font-size:13px;color:var(--sub)}
  .panel{background:var(--card);border-radius:16px;padding:14px;box-shadow:0 1px 2px rgba(0,0,0,.04);margin-bottom:12px}
  .lbl{font-size:12px;font-weight:700;color:var(--sub);margin:2px 2px 8px}
  .seg{display:flex;background:#eef1f4;border-radius:12px;padding:4px;gap:4px;margin-bottom:12px}
  .seg button{flex:1;border:0;background:transparent;padding:10px 0;border-radius:9px;font:inherit;font-size:15px;font-weight:700;color:var(--sub);cursor:pointer}
  .seg button.on{background:#fff;color:var(--navy);box-shadow:0 1px 3px rgba(0,0,0,.08)}
  .chips{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
  .chips button{border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:10px 0;font:inherit;font-size:14px;font-weight:500;color:var(--ink);cursor:pointer}
  .chips button.on{border-color:var(--navy);background:var(--navy);color:#fff;font-weight:700}
  .hero{background:var(--navy);color:#fff;border-radius:18px;padding:20px 18px;margin-bottom:12px}
  .hero .top{display:flex;align-items:center;gap:8px;font-size:14px;opacity:.9}
  .badge{display:inline-block;font-size:12px;font-weight:700;padding:3px 8px;border-radius:999px;background:var(--orange);color:#fff}
  .badge.next{background:rgba(255,255,255,.18)}
  .hero .date{font-size:15px;font-weight:700}
  .hero .range{font-size:38px;font-weight:800;letter-spacing:-1px;margin:8px 0 2px;line-height:1.15}
  .hero .book{font-size:14px;opacity:.85}
  .hero .info{margin-top:14px;border-top:1px solid rgba(255,255,255,.18);padding-top:12px;display:grid;gap:6px}
  .hero .info div{display:flex;gap:10px;font-size:14px}
  .hero .info b{min-width:92px;font-weight:500;opacity:.75}
  .season{margin-top:10px;font-size:12px;opacity:.7}
  .list .row{display:flex;align-items:center;justify-content:space-between;padding:11px 4px;border-bottom:1px solid var(--line);font-size:15px}
  .list .row:last-child{border-bottom:0}
  .list .row .d{color:var(--sub);font-size:14px;min-width:84px}
  .list .row .r{font-weight:700;text-align:right}
  .list .row .r small{display:block;font-weight:400;color:var(--sub);font-size:12px;margin-top:2px}
  .list .row .r small b{font-weight:700;color:var(--ink)}
  .list .row.past{opacity:.38}
  .list .row.cur{background:var(--orange-soft);border-radius:10px;padding-left:10px;padding-right:10px;border-bottom-color:transparent}
  .list .row[data-i]{cursor:pointer;-webkit-tap-highlight-color:transparent}
  .list .row[data-i]:active{background:#eef1f4;border-radius:10px}
  .list .row.sel{background:#e8eef6;border-radius:10px;padding-left:10px;padding-right:10px;border-bottom-color:transparent;opacity:1}
  .badge.past{background:#8a96a3}
  .cal-head{display:flex;align-items:center;justify-content:space-between;margin:0 2px 10px}
  .cal-head b{font-size:16px;font-weight:800;color:var(--navy)}
  .cal-nav{border:0;background:#eef1f4;color:var(--navy);width:34px;height:34px;border-radius:10px;font:inherit;font-size:16px;font-weight:700;cursor:pointer}
  .cal-nav:disabled{opacity:.3;cursor:default}
  .cal{display:grid;grid-template-columns:.62fr 1fr 1fr 1fr 1fr 1fr .62fr;gap:3px}
  .cal .w{text-align:center;font-size:11px;font-weight:700;color:var(--sub);padding:2px 0 6px}
  .cal .w.sun{color:#d9534f}.cal .w.sat{color:#3b7dd8}
  .cal .c{min-height:50px;border-radius:9px;padding:5px 2px 4px;text-align:center;font-size:12px;color:#b7bfc8;display:flex;flex-direction:column;align-items:center;gap:3px;border:1.5px solid transparent}
  .cal .c.out{visibility:hidden}
  .cal .c.t{background:#f3f6f9;color:var(--ink);cursor:pointer;-webkit-tap-highlight-color:transparent}
  .cal .c.t.p{color:#8a96a3}
  .cal .c.t .v{font-size:11px;font-weight:700;color:var(--navy);line-height:1.15;word-break:keep-all;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .cal .c.t.p .v{color:#8a96a3}
  .cal .c.t.sum{background:var(--mint-soft)}
  .cal .c.t.sum .v{color:#13877a}
  .cal .c.t.off .v{color:#8a96a3;font-weight:500}
  .cal .c.today{border-color:var(--orange)}
  .cal .c.today .n{color:var(--orange);font-weight:800}
  .cal .c.on,.cal .c.t.on,.cal .c.t.sum.on{background:var(--navy);border-color:var(--navy)}
  .cal .c.on .n,.cal .c.on .v{color:#fff !important}
  .cal .c.on.today{border-color:var(--orange)}
  .cal-leg{display:flex;flex-wrap:wrap;gap:4px 12px;justify-content:center;font-size:11px;color:var(--sub);margin-top:12px}
  .cal-leg i{display:inline-block;width:10px;height:10px;border-radius:3px;vertical-align:-1px;margin-right:4px}
  .back{display:inline-block;margin-left:auto;border:0;background:rgba(255,255,255,.16);color:#fff;font:inherit;font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;cursor:pointer}
  .tag{font-size:11px;font-weight:700;padding:2px 6px;border-radius:6px;margin-left:6px;vertical-align:2px}
  .tag.t{background:var(--mint-soft);color:#13877a}
  .tag.v{background:#eef1f4;color:var(--sub)}
  .hero .range .tag{font-size:15px;font-weight:800;padding:4px 9px;border-radius:8px;margin-left:10px;vertical-align:8px;letter-spacing:0}
  .hero .range .tag.t{background:#5fd3c4;color:#0b3d37}
  .hero .range .tag.v{background:#ffd479;color:#4a3300}
  details summary{list-style:none;cursor:pointer;font-weight:700;font-size:15px;color:var(--navy);display:flex;justify-content:space-between}
  details summary::-webkit-details-marker{display:none}
  details[open] summary .chev{transform:rotate(180deg)}
  .chev{transition:transform .2s}
  .sep{font-size:12px;font-weight:700;color:var(--sub);padding:14px 4px 4px}
  .msg{text-align:center;color:var(--sub);padding:40px 0;font-size:14px}
  .foot{text-align:center;font-size:12px;color:var(--sub);margin-top:16px;line-height:1.7;word-break:keep-all}
  .foot a{color:inherit;text-decoration:none;font-weight:700}
</style>
</head>

<div class="wrap">
  <header>
    <div><img class="logo" id="logo" alt="JK영어국어학원" hidden><h1>JK 단어시험 범위</h1></div>

  <div class="panel">

/* ▼▼ Apps Script 웹 앱 주소(/exec로 끝나는 주소)를 따옴표 안에 붙여넣기 ▼▼ */
var API_URL = 'https://script.google.com/macros/s/AKfycbw1zZen2QSPxbGugbsQy_M561HUv9otSZscJmbD1ZSOOVMSeDM4_UlMEzE5sKcwvhkc/exec';

var PARAMS = (function(){ var o={}; try{ new URLSearchParams(location.search).forEach(function(v,k){ o[k]=v; }); }catch(e){} return o; })();
var DATA = null;
var S = { grade:null, cls:null, book:null };
var SEL = null, CUR_ROWS = [], CALM = null;   // CALM: 캘린더에 보이는 달 'yyyy-mm'   // 학생이 눌러서 보고 있는 회차(날짜). null이면 오늘/다음 시험

function load(k){ try{ return localStorage.getItem('jkv_'+k); }catch(e){ return null; } }
function save(k,v){ try{ localStorage.setItem('jkv_'+k,v); }catch(e){} }
function esc(s){ return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
function day(v){ return /^\d/.test(v) ? 'Day '+v : v; }
function tags(v){
  var t='';
  if(/총괄/.test(v)) t+='<span class="tag t">총괄</span>';
  if(/ver\s*3/i.test(v)) t+='<span class="tag v">ver3</span>';
  return t;
}
function clean(v){ return v.replace(/\s*총괄/,'').replace(/\s*ver\s*3/i,'').trim(); }

function init(data){
  DATA = data;
  var d = new Date(data.today+'T00:00:00');
  document.getElementById('today').textContent =
    (d.getMonth()+1)+'월 '+d.getDate()+'일 ('+'일월화수목금토'[d.getDay()]+')';

  var keys = data.tabs.map(function(t){return t.key;});
  S.grade = pick(PARAMS.grade, load('grade'), keys, keys[0]);
  S.cls   = pick(PARAMS['class'], load('cls'), ['mw','tt'], (d.getDay()===2||d.getDay()===4)?'tt':'mw');
  document.getElementById('segGrade').innerHTML = data.tabs.map(function(t){
    return '<button data-v="'+t.key+'">'+esc(t.label)+'</button>';}).join('');
  bindSeg('segGrade','grade'); bindSeg('segClass','cls');
  document.getElementById('main').addEventListener('click', onMainClick);
  render();
}
function pick(a,b,allowed,def){ if(allowed.indexOf(a)>=0) return a; if(allowed.indexOf(b)>=0) return b; return def; }
function bindSeg(id,key){
  document.getElementById(id).onclick=function(e){
    var v=e.target.getAttribute('data-v'); if(!v) return;
    S[key]=v; save(key,v); SEL=null; CALM=null; render();
  };
}
function tab(){ return DATA.tabs.filter(function(t){return t.key===S.grade;})[0]; }

function render(){
  var T = tab();
  ['segGrade','segClass'].forEach(function(id){
    var cur = id==='segGrade'?S.grade:S.cls;
    [].forEach.call(document.getElementById(id).children,function(b){ b.classList.toggle('on', b.getAttribute('data-v')===cur); });
  });
  S.book = pick(S.book||PARAMS.book, load('book'), T.books, null);
  var chips = document.getElementById('chips');
  chips.innerHTML = T.books.map(function(b){
    return '<button class="'+(b===S.book?'on':'')+'" data-v="'+esc(b)+'">'+esc(b)+'</button>';}).join('');
  chips.onclick=function(e){ var v=e.target.getAttribute('data-v'); if(!v) return; S.book=v; save('book',v); render(); };

  var main = document.getElementById('main');
  if(!S.book){ main.innerHTML='<div class="msg">위에서 내 단어장을 선택하세요.</div>'; return; }

  var rows = T.rows.filter(function(r){ return r[S.cls]; });
  var today = DATA.today, ci = -1;
  for(var i=0;i<rows.length;i++){ if(rows[i][S.cls].iso>=today){ ci=i; break; } }
  CUR_ROWS = rows;
  if(ci<0){
    if(!SEL || !rows.some(function(r){return r[S.cls].iso===SEL;})){
      SEL=null;
      main.innerHTML='<div class="msg">등록된 다음 시험 일정이 없습니다.</div>'+calHtml(rows, -1, today);
      return;
    }
    ci = rows.length;   // 다음 시험이 없음 → 선택한 지난 회차만 카드로 표시
  }

  var si = ci;
  if (SEL) { for (var k=0;k<rows.length;k++){ if(rows[k][S.cls].iso===SEL){ si=k; break; } } if (si===ci) SEL=null; }
  var cur = rows[si], v = cur.range[S.book]||'-', iso = cur[S.cls].iso, isToday = iso===today;
  var badge = isToday ? ['','오늘 시험'] : (si===ci ? ['next','다음 시험'] : (iso<today ? ['past','지난 시험'] : ['next','예정 시험']));
  var info = cur.info.map(function(x){ return '<div><b>'+esc(x.k)+'</b><span>'+esc(x.v)+'</span></div>'; }).join('');
  var html =
    '<div class="hero">'+
      '<div class="top"><span class="badge '+badge[0]+'">'+badge[1]+'</span>'+
      '<span class="date">'+cur[S.cls].label+'</span>'+
      (si!==ci ? '<button class="back" id="backBtn">'+(rows[ci]&&rows[ci][S.cls].iso===today?'오늘 시험':(rows[ci]?'다음 시험':'처음 화면'))+'으로 ↩</button>' : '')+
      '</div>'+
      '<div class="range">'+esc(day(clean(v)))+tags(v)+'</div>'+
      '<div class="book">'+esc(S.book)+'</div>'+
      (info?'<div class="info">'+info+'</div>':'')+
      (cur.school?'<div class="season">'+esc(T.schoolLabel||'시험 보는 학교/학년')+': '+esc(cur.school)+'</div>':'')+
    '</div>';

  html += calHtml(rows, si, today);

  var all='', lastSchool=null;
  rows.forEach(function(r,i){
    if(r.school && r.school!==lastSchool){ all+='<div class="sep">'+esc(r.school)+'</div>'; }
    lastSchool=r.school;
    all+=rowHtml(r, i===si&&si!==ci?'sel':(i<ci?'past':(i===ci?'cur':'')), i);
  });
  html += '<div class="panel"><details id="allD"><summary>시험범위 전체 보기 <span class="chev">▾</span></summary><div class="list">'+all+'</div></details></div>';
  main.innerHTML = html;

  document.getElementById('allD').addEventListener('toggle',function(){
    if(this.open && !RESTORING){ var c=this.querySelector('.row.cur'); if(c) c.scrollIntoView({block:'center'}); }
  });
}
/* 행을 누르면 위 카드에 그 회차를 크게 표시 / '오늘 시험으로' 버튼은 원래대로 */
function onMainClick(e){
  if (e.target.closest('#backBtn')) { SEL=null; CALM=null; render(); scrollHero(); return; }
  var nav = e.target.closest('.cal-nav');
  if (nav) { if(nav.disabled) return;
    var y=+CALM.slice(0,4), m=+CALM.slice(5,7)+(+nav.getAttribute('data-m'));
    if(m<1){m=12;y--;} if(m>12){m=1;y++;} CALM=y+'-'+('0'+m).slice(-2); render(); return; }
  var calCell = e.target.closest('.cal .c[data-i]');
  var row = calCell || e.target.closest('.row[data-i]'); if(!row) return;
  var r = CUR_ROWS[+row.getAttribute('data-i')]; if(!r) return;
  SEL = r[S.cls].iso; CALM = ym(SEL);
  var det=document.getElementById('allD'), op=det&&det.open;
  render();
  if(op){ var nd=document.getElementById('allD'); if(nd){ RESTORING=true; nd.open=true; setTimeout(function(){RESTORING=false;},0); } }
  scrollHero();
}
function scrollHero(){ var h=document.querySelector('.hero'); if(h) h.scrollIntoView({behavior:'smooth',block:'start'}); }
/* ── 캘린더: 반(월수/화목) 수업일에 범위 표시, 누르면 위 카드에 크게 ── */
function ym(iso){ return iso.slice(0,7); }
function shortV(v){
  if(!v) return '';
  if(/^\d/.test(v)) return clean(v);                       // '39~42ver3' → '39~42'
  var k=['휴강','연휴','방학'].filter(function(w){ return v.indexOf(w)>=0; })[0];  // '추석연휴 휴강'→'휴강'
  return k || v.split(/\s+/)[0];                                                   // '실전 시험'→'실전'
}
function calHtml(rows, si, today){
  if(!rows.length) return '';
  var byDay={}; rows.forEach(function(r,i){ byDay[r[S.cls].iso]=i; });
  var first=ym(rows[0][S.cls].iso), last=ym(rows[rows.length-1][S.cls].iso);
  if(!CALM) CALM = si>=0 ? ym(rows[si][S.cls].iso) : last;
  if(CALM<first) CALM=first; if(CALM>last) CALM=last;
  var y=+CALM.slice(0,4), m=+CALM.slice(5,7);
  var start=new Date(y,m-1,1).getDay(), days=new Date(y,m,0).getDate();
  var selIso = si>=0 ? rows[si][S.cls].iso : '';
  var g='';
  '일월화수목금토'.split('').forEach(function(w,k){ g+='<div class="w'+(k===0?' sun':k===6?' sat':'')+'">'+w+'</div>'; });
  for(var k=0;k<start;k++) g+='<div class="c out"></div>';
  for(var d=1; d<=days; d++){
    var iso=CALM+'-'+('0'+d).slice(-2), i=byDay[iso], cls='c';
    if(iso===today) cls+=' today';
    if(i==null){ g+='<div class="'+cls+'"><span class="n">'+d+'</span></div>'; continue; }
    var v=rows[i].range[S.book]||'';
    cls+=' t'+(iso<today?' p':'')+(/총괄/.test(v)?' sum':'')+(/^\d/.test(v)?'':' off')+(iso===selIso?' on':'');
    g+='<div class="'+cls+'" data-i="'+i+'"><span class="n">'+d+'</span><span class="v">'+esc(shortV(v))+'</span></div>';
  }
  return '<div class="panel">'+
    '<div class="cal-head"><button class="cal-nav" data-m="-1"'+(CALM<=first?' disabled':'')+'>‹</button>'+
    '<b>'+y+'년 '+m+'월</b>'+
    '<button class="cal-nav" data-m="1"'+(CALM>=last?' disabled':'')+'>›</button></div>'+
    '<div class="cal">'+g+'</div>'+
    '<div class="cal-leg"><span><i style="background:#f3f6f9;border:1px solid #dfe4ea"></i>시험일 (누르면 범위 보기)</span>'+
    '<span><i style="background:var(--mint-soft)"></i>총괄</span>'+
    '<span><i style="border:1.5px solid var(--orange)"></i>오늘</span>'+
    '<span><i style="background:var(--navy)"></i>보고 있는 날</span></div>'+
  '</div>';
}
function rowHtml(r,cls,idx){
  var v=r.range[S.book]||'-';
  // 교과서 주요문장·해석시험 등 범위가 있으면 아래에 작게 함께 표시
  var sub=r.info.map(function(x){ return esc(x.k)+' <b>'+esc(x.v)+'</b>'; }).join(' · ');
  return '<div class="row '+(cls||'')+'"'+(idx!=null?' data-i="'+idx+'"':'')+'><span class="d">'+r[S.cls].label+'</span>'+
         '<span class="r">'+esc(day(clean(v)))+tags(v)+(sub?'<small>'+sub+'</small>':'')+'</span></div>';
}

/* ── 자동 갱신: 화면을 켜 둔 동안 1분마다 + 앱으로 돌아올 때 시트를 다시 읽음 ── */
var LAST = '', BUSY = false, RESTORING = false, INITED = false;
function fetchData(){
  if (BUSY) return; BUSY = true;
  loadData(function(d){
    BUSY = false;
    var s = JSON.stringify(d);
    if (!INITED) { INITED = true; LAST = s; init(d); return; }
    if (s === LAST) return;                       // 바뀐 게 없으면 화면 그대로
    LAST = s;
    var det = document.getElementById('allD'), wasOpen = det && det.open;
    var y = window.scrollY;
    DATA = d; render();                           // 학생 선택(학년·반·단어장)은 유지
    var nd = document.getElementById('allD');
    if (wasOpen && nd) { RESTORING = true; nd.open = true; setTimeout(function(){ RESTORING = false; window.scrollTo(0, y); }, 0); }
    window.scrollTo(0, y);
  }, function(err){
    BUSY = false;
    if (!INITED) document.getElementById('main').innerHTML =
      '<div class="msg">범위를 불러오지 못했어요.<br>잠시 후 다시 시도해 주세요.<br><br>'+
      '<button class="back" style="background:var(--navy)" onclick="fetchData()">다시 시도</button></div>';
    if (window.console) console.warn('load failed', err);
  });
}
function startApp(){
  fetchData();
  setInterval(function(){ if (!document.hidden) fetchData(); }, 60 * 1000);
  document.addEventListener('visibilitychange', function(){ if (!document.hidden) fetchData(); });
}
function loadData(ok, fail){
  if (window.__MOCK__) { ok(window.__MOCK__); return; }
  if (API_URL.indexOf('여기에_배포ID') >= 0) { fail(new Error('API_URL 미설정')); return; }
  // credentials:'omit' → 구글 로그인 정보를 보내지 않음 (보호자 관리 계정이어도 열림)
  fetch(API_URL + (API_URL.indexOf('?') < 0 ? '?' : '&') + 'api=1&t=' + Date.now(),
        { credentials: 'omit', cache: 'no-store', redirect: 'follow' })
    .then(function(r){ if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(function(d){ if (!d || !d.tabs) throw new Error('데이터 형식 오류'); ok(d); })
    .catch(fail);
}
startApp();
</script>
